module: core
goModule: github.com/moduleforge/core-api

go:
  api:
    modulePath: github.com/moduleforge/core-api
    dir: ./api
  model:
    modulePath: github.com/moduleforge/core-model
    dir: ./model

migrations:
  range:
    first: 1
    last: 99

provides:
  services:
    # typeResolver maps resource slugs to internal type IDs.
    - name: typeResolver
      type: "*types.Resolver"
      constructor: types.New
      returnsError: true
      args:
        - context        # context.Context for startup-time DB query
        - queries:coredb # coredb.New(pool) — reads the types table at boot

    # entityResolver maps entity UUIDs to internal int64 IDs.
    - name: entityResolver
      type: "*entity.Resolver"
      constructor: entity.NewResolver
      args: []

    # cipher loads the AES-256-GCM field encryption key from CORE_FIELD_KEY_HEX.
    - name: cipher
      type: "*fieldcrypto.Cipher"
      constructor: fieldcrypto.NewFromEnv
      returnsError: true
      args: []

    # coreServices is the aggregate of all entity service implementations.
    - name: coreServices
      type: "*coreservice.Services"
      constructor: coreservice.New
      args:
        - queries:coredb
        - infra:pool
        - service:authorizer
        - service:observerGroup
        - service:cipher
        - service:entityResolver
        - service:typeResolver

    # naturalPersonService extracts NaturalPersonServicer from coreServices.
    - name: naturalPersonService
      type: "coreservice.NaturalPersonServicer"
      constructor: coreservice.NaturalPersonFromServices
      args:
        - service:coreServices

    # coreDeps carries the external dependencies for the core httpapi router.
    # Requires coreServices (entity CRUD) and logger (structured logging).
    - name: coreDeps
      type: "corehttpapi.Deps"
      constructor: corehttpapi.NewDeps
      args:
        - service:coreServices   # *coreservice.Services
        - infra:logger           # *slog.Logger — from app manifest

    # noopObserver is a MutationObserver that does nothing.
    - name: noopObserver
      type: "observer.NoopObserver"
      constructor: observer.NewNoopObserver
      args: []

    # coreAppsHandler serves the top-level /apps CRUD (Create/List/GetApp/
    # UpdateApp/DeleteApp). Closes followup Gp5C: mod-users' reference server
    # wired these routes as raw inline chi in its own main.go, never declared
    # in any module manifest, so they were unreachable on any mfgen-generated
    # app. Apps are now core entities (fundamental_type = "app"), so the
    # handler lives in mod-core alongside entityResolver. corehttpapi is the
    # same alias coreDeps/coreServices above already use for this module's
    # api/httpapi package. Arg order matches corehttpapi.NewAppsHandler's doc
    # comment: infra:pool, queries:coredb, service:authorizer,
    # service:observerGroup, service:entityResolver, service:typeResolver.
    - name: coreAppsHandler
      type: "*corehttpapi.AppsHandler"
      constructor: corehttpapi.NewAppsHandler
      args:
        - infra:pool
        - queries:coredb
        - service:authorizer
        - service:observerGroup
        - service:entityResolver
        - service:typeResolver

  observers:
    - name: noopSentinel
      service: noopObserver
      policy: swallow

  routes:
    # Core entity endpoints (/v1/entities/*) mounted inside the /v1 route group.
    # innerMount: true causes mfgen to emit:
    #   r.Route("/v1", func(r chi.Router) { r.Mount("/", corehttpapi.NewRouter(coreDeps)) })
    # instead of a top-level r.Mount("/v1", ...) which would conflict with the
    # mod-users /v1 route group and cause a chi duplicate-prefix panic (gap G14).
    - prefix: /v1
      mountFromModule: corehttpapi.NewRouter
      innerMount: true
      args:
        - service:coreDeps

    # Top-level /apps CRUD (followup Gp5C). handler: coreAppsHandler references
    # the already-constructed provides.services entry above (no separate
    # constructor/args here — mirrors mod-authz's authzServices route entry),
    # and register: composes RegisterAppRoutes onto the shared /v1 route tree
    # instead of mounting a second full router at /v1 (the same
    # duplicate-Mount panic, gap G14, that the mountFromModule/innerMount
    # entry above avoids for the entities router, and that mod-tags'
    # register:-onto-/v1 entry documents for the same reason). Because
    # RegisterAppRoutes itself registers absolute /apps and /apps/{uuid}
    # paths (see api/httpapi/apps.go), nesting it inside the shared /v1
    # group yields /v1/apps, /v1/apps/{uuid}, matching the /v1/apps surface
    # mod-users' reference server exposed via inline chi (never reachable on
    # a generated app, since it was never declared in any manifest).
    - prefix: /v1
      handler: coreAppsHandler
      register: corehttpapi.RegisterAppRoutes
      scope: authenticated

requires:
  services:
    - name: authorizer
  infra:
    - name: pool
    - name: logger    # *slog.Logger — from app manifest (for corehttpapi.NewDeps)
