    - number: 2
      slug: versioned-cipher
      title: Versioned Multi-Key Cipher
      diff_base: d9a6106c8994c39b3a716a5e10a677908134d392
      tasks:
        - number: 1
          slug: multi-key-cipher-core
          title: Multi-Key Versioned Cipher Core
          path: phase-02-versioned-cipher/001-multi-key-cipher-core.md
          done: true
          tier: opus-high
          digest: 'Rewrote api/internal/fieldcrypto as a reloadable multi-key cipher: immutable keySet behind atomic.Pointer, mutex-collapsed reload, version(4)||nonce(12)||ciphertext||tag(16) blob format with version bound as AAD. Encrypt/Decrypt/DecryptWithRotation/Reload take ctx; BlobVersion is package-level. NewFromKey (store-less) and NewFromEnvOrGenerate (guarded bootstrap, lost-race adoption, CORE_FIELD_KEY_HEX first-boot seed, fail-loudly on later mismatch) replace NewFromEnv, which is gone from both packages. Inline security review (review_focus) found the diff a net security improvement (AAD binding, key zeroing, boundary validation, reload rate limit); two hardening gaps fixed in-diff (all-zero key rejection), three suggestion-level findings recorded, none blocking. cd api && make build/test/lint, go test -race, go vet -tags integration, and a real-Postgres integration run (6/6 tests) all pass.'
          git:
            branch: plan/fieldcrypto-key-rotation-02-001
            commit:
                - 0e0d058
            merge: 81ba702
        - number: 2
          slug: facade-key-store-adapter
          title: Facade Key Store Adapter
          path: phase-02-versioned-cipher/002-facade-key-store-adapter.md
          done: true
          tier: sonnet-high
          digest: 'Replaced task 001''s placeholder api/fieldcrypto/fieldcrypto.go with its real shape: a FieldKeyQuerier interface declared over coredb.FieldCryptoKey/coredb.Querier-shaped methods, an unexported keyStoreAdapter mapping rows onto fieldcrypto.KeyRecord with an explicit negative-version guard, and NewFromEnvOrGenerate(ctx, FieldKeyQuerier) wrapping the adapter — name/params/error-return unchanged from what moduleforge.module.yaml''s cipher block already names, so the manifest required zero edits. Façade re-exports Rotation and BlobVersion alongside existing aliases. Full api build/test/lint green including -race; inline security review found no issues, confirming the adapter respects task 001''s key-material zeroing contract.'
          git:
            branch: plan/fieldcrypto-key-rotation-02-002
            commit:
                - a467939
            merge: b0d616e
