      text: 'Sandbox-only note: a native non-Docker Postgres on localhost:5432 shadows the shared container in this environment, causing the same pre-existing localhost-resolution issue the already-landed authz/setup integration test also hits. Worked around via CORE_DEV_PG_HOST pointed at the LAN IP for validation only, no source change. Worth awareness if other integration suites on this host need the same workaround.'
    - title: 'rotating_cipher: pool 2nd-conn deadlock risk'
      id: 6hKu
      date: "2026-08-14"
      tags:
        - plan/phase:phase-03-rotate-on-read
        - plan/slug:fieldcrypto-key-rotation
        - type:security
        - priority:unspecified
        - effort:unspecified
      text: 'RotatingCipher.writeBack opens its own transaction on the same pool service.New shares as the base querier. Services.Querier''s own doc comment invites callers to derive a tx-scoped querier via coredb.New(tx) and pass it to GetByEntityUUID, so a caller already holding one pool connection inside its own transaction could trigger a rotating read that blocks acquiring a second connection from the same pool — with every connection held this way, the pool self-deadlocks until request contexts expire. SET LOCAL lock_timeout bounds the lock wait but not the connection-acquisition wait before the transaction begins. Reachability from mod-core itself is not established (mod-core''s own httpapi handlers don''t use this call shape), but out-of-repo composing apps might. Fix options: wrap the write-back''s txhelper.Run in a context.WithTimeout on the order of the existing 250ms lock timeout so pool saturation degrades into an ordinary write-back failure the policy branches already handle; or give RotatingCipher a small dedicated pool distinct from the request pool. Either way, document on the db field that the handle must not be one a caller may already hold a connection from. Worth checking against mod-users and the composing apps (app-mfmanager, app-mfdemo) at the same time as the already-deferred NewFromEnv compile-break followup, since that followup already requires visiting all three composition roots. Found by phase-3 boundary security review (opus-high). api/service/rotating_cipher.go:248-256. Severity: minor, confidence: medium.'
    - title: 'rotating_cipher: lock-timeout 500s'
      id: PNVB
      date: "2026-08-14"
      tags:
        - plan/phase:phase-03-rotate-on-read
        - plan/slug:fieldcrypto-key-rotation
        - type:documentation
        - priority:unspecified
        - effort:unspecified
      text: 'Under a compromised rotation, any competing row lock on the row being read (e.g. a legitimate concurrent update of the same entity''s own subtype row) converts an ordinary read into a 500: the write-back''s CAS blocks behind the lock, SET LOCAL lock_timeout=''250ms'' fires, and the compromised branch correctly fails the read (verified end-to-end by the new integration sub-case at rotating_cipher_integration_test.go:710-743). The failure direction is correct — the CAS never ran, so compromised ciphertext genuinely can''t be shown to be gone — but this operator-visible consequence (sporadic 500s on reads of concurrently-edited rows during a compromise response) is not recorded anywhere. Two options: retry the write-back transaction once on a lock-timeout SQLSTATE 55P03 before adjudicating the policy branch (transient contention usually clears within a second attempt), or document the consequence explicitly. This should feed into the already-deferred app-mfmanager deploy/README.md ''Secret generation, loss, and rotation'' rewrite (see plan/overview.md''s Deferred and flagged section) alongside the existing guidance about restarting the fleet after a compromised rotation. Found by phase-3 boundary security review (opus-high). api/service/rotating_cipher.go:265-272. Severity: suggestion, confidence: high.'
    - title: 'rotating_cipher: missing std-rotation test'
      id: fKHH
      date: "2026-08-14"
      tags:
        - plan/phase:phase-03-rotate-on-read
        - plan/slug:fieldcrypto-key-rotation
        - type:enhancement
        - priority:unspecified
        - effort:unspecified
      text: 'The integration suite pins the compromised half of the per-key failure policy end-to-end against a real database (real field_crypto_keys rows, real RetireActiveFieldCryptoKey, real facade adapter), but never pins the standard half the same way — its only standard-rotation case has a write-back that succeeds. Every test exercising the tolerate-on-failure branch builds its fieldcrypto.KeyRecord by hand in Go with CompromisedAt left nil, so the SQL that actually derives that column (compromised_at = CASE WHEN compromised THEN now() ELSE NULL END in RetireActiveFieldCryptoKey) and the facade adapter''s mapping of it are untested for the false case. An inversion or mis-mapping anywhere on that path would make every ordinary rotation silently adopt compromised-key policy — reads would start 500ing on any transient write-back failure (a read-only replica, a lock timeout, a permission error) while the entire test suite, including the standard integration case, stayed green. Fix: add a fourth sub-case to the standard-rotation integration test reproducing the compromised suite''s competing-row-lock technique against a standard-rotated key, asserting the read succeeds and returns correct plaintext with the stored blob unchanged — the direct counterpart of the existing compromised sub-case at rotating_cipher_integration_test.go:710-743. Found by phase-3 boundary security review (opus-high). Severity: minor, confidence: medium.'
