    - title: 'Task doc''s validation step 6 literal command '
      id: kdAa
      date: "2026-08-06"
      tags:
        - type:ambiguity
        - plan/phase:spacing-token-contract
        - priority:unspecified
        - effort:unspecified
      text: 'Task doc''s validation step 6 literal command (tailwindcss -i /tmp/consumer-probe.css ... --content /tmp/consumer-probe.html) does not work in this environment: Tailwind v4''s CLI resolves the bare @import "tailwindcss" specifier via Node-style resolution starting at the importing CSS file''s own directory and walking up for node_modules; /tmp has no node_modules ancestor. Not environment-specific — inherent to the resolver. Agent substituted an equivalent probe from an untracked, deleted-before-commit temp directory inside gui/ with identical results. Suggest updating the task doc''s validation step 6 to use an in-tree (but untracked) location instead of /tmp for future re-runs.'
    - title: Per-component radius override levers
      id: 7nrP
      date: "2026-08-06"
      tags:
        - type:enhancement
        - plan/phase:contract-documentation
        - priority:unspecified
        - effort:unspecified
      text: gui/tokens/CONTRACT.md documents --mf-radius as the single settable radius lever, with --radius-sm/-md/-lg/-xl derived from it via calc(var(--mf-radius, var(--mf-radius-default)) * k) and explicitly not individually settable. A brand that wants, say, pill-shaped buttons but square-cornered cards cannot express that — every primitive rescales together. The component-override tier (gui/tokens/component/overrides.json, mf.component.<component>.<property>) already exists as the convention for exactly this kind of escape hatch and is intentionally empty; it is the natural home. Note that the per-breakpoint-band lever family added for --mf-content-margins-* is a worked precedent for layering a second override axis onto a derived-calc() token, and could be adapted — the axis there is breakpoint, here it would be component. Not designed, not scoped.
    - title: Adopt spacing tokens in downstream GUIs
      id: AkGw
      date: "2026-08-06"
      tags:
        - type:enhancement
        - plan/phase:contract-documentation
        - priority:unspecified
        - effort:unspecified
      text: 'app-mftodo/gui/src/tasks/TaskListContainer.tsx, TaskDetailContainer.tsx, and TaskEditorContainer.tsx hardcode mx-auto max-w-2xl p-6 across eight call sites, and mod-core/gui/src/ProfileEditor.tsx hardcodes p-6 max-w-xl. These should consume @moduleforge/core-gui''s container utility (or max-w-content) via the @moduleforge/core-gui/tokens.css export, so page width and gutters become brand-overridable instead of per-component literals. This mirrors the existing adoption-gap follow-on already recorded for mod-tags, mod-tasks, mod-contacts, mod-users, and app-mfdemo. Note the concrete blocker an implementer will hit immediately: --mf-max-content-width defaults to 80rem while these pages currently sit at max-w-2xl (42rem), so adoption is not a mechanical substitution — it needs a per-app --mf-max-content-width override or a narrower wrapper, and is a visible layout change either way.'
    - title: Narrow-measure content width token
      id: XKY2
      date: "2026-08-06"
      tags:
        - type:enhancement
        - plan/phase:contract-documentation
        - priority:unspecified
        - effort:unspecified
      text: --mf-max-content-width is a single global scalar, so an application whose shell is wide (80rem) but whose reading-oriented pages want a narrow measure (~42rem) cannot express both through the token contract. The obvious extensions are a second role (--mf-max-content-width-narrow) or a container-narrow utility emitted alongside container by gui/style-dictionary/build-tokens.mjs. gui/tokens/CONTRACT.md records this as an accepted open limitation; this item is the tracked follow-up for closing it. Deliberately not designed here — the right shape depends on what downstream adoption actually needs.
