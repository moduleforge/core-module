    - title: 'Optional: zero field-crypto key after use'
      id: MnvB
      date: "2026-08-10"
      tags:
        - type:security
        - priority:low
        - effort:small
        - plan/phase:phase-01-durable-field-key
        - plan/slug:catalog-readiness
      text: '[Surfaced by phase-01 escalated security review lens, suggestion severity, low confidence] api/internal/fieldcrypto/fieldcrypto.go''s fromPersistedOrGenerated never explicitly zeroes the randomly generated candidate key or persisted-key byte slices after they''re consumed by NewFromKey — they remain reachable in memory until GC''s normal schedule rather than being scrubbed immediately after use. Optional hardening only: consider zeroing candidate (and persisted-key slices) via a defer after consumption by NewFromKey. Go''s GC/escape-analysis semantics mean this is best-effort, not a guarantee — reviewer explicitly scored this a suggestion, not a blocking finding.'
    - title: Task 002's coredb adapter must return freshly
      id: MEqf
      date: "2026-08-13"
      tags:
        - type:ambiguity
        - plan/phase:versioned-cipher
        - plan/slug:fieldcrypto-key-rotation
        - priority:unspecified
        - effort:unspecified
      text: Task 002's coredb adapter must return freshly allocated KeyBytes it does not retain — the Cipher now zeroes key material a KeyStore hands it once AEADs are built (followup MnvB). A store that caches/reuses a returned slice would hand back zeros on its next call. Documented on the KeyStore interface, covered by TestKeyMaterialZeroedAfterLoad, backstopped by all-zero-key rejection — but 002's implementer needs to know explicitly.
    - title: 'fieldcrypto: cancelled-ctx reload budget'
      id: EoJ6
      date: "2026-08-13"
      tags:
        - plan/phase:phase-02-versioned-cipher
        - plan/slug:fieldcrypto-key-rotation
        - type:security
        - priority:unspecified
        - effort:unspecified
      text: 'reload() stamps lastLoadAttempt before issuing its query, so a decrypt driven by an already-cancelled request context burns the shared reload rate-limit budget (minReloadInterval) for no useful work — LoadUsableKeys returns ctx.Err() immediately. For the following window, encryptSet''s TTL-driven refresh takes its early-return branch and silently keeps the stale snapshot (no log at all on that branch, unlike the reload-failure branch). This can delay a replica''s convergence onto a rotated key set. Fix: don''t charge a context-cancellation failure against the shared budget (restore lastLoadAttempt on ctx.Err()); log at warn from encryptSet''s early-return branch when the snapshot is past keySetTTL but reload was rate-limited. Found by phase-2 boundary security review (opus-high), api/internal/fieldcrypto/fieldcrypto.go:335-347 and :404-424. Severity: minor, confidence: medium.'
    - title: 'fieldcrypto: missing retired-flags check'
      id: pDiP
      date: "2026-08-13"
      tags:
        - plan/phase:phase-02-versioned-cipher
        - plan/slug:fieldcrypto-key-rotation
        - type:security
        - priority:unspecified
        - effort:unspecified
      text: 'buildKeySet re-validates most schema invariants (no/two active keys, duplicate version, version 0, wrong key length) but not the one enforced by the field_crypto_keys_retired_only_flags CHECK: that an active (retired_at IS NULL) row must not carry compromised_at or decryptable_until. Not reachable via the shipped SQL today (the CHECK constraint and the retired_at IS NOT NULL guards on the two mutation queries close it), but KeyStore is an interface — a non-DB implementation could violate it, silently producing MustPersist:false for a compromised-yet-active key, or an active key past its own grace deadline. Fix: reject such a record in buildKeySet''s active-record branch with a loud error, mirroring the neighbouring checks. Found by phase-2 boundary security review (opus-high), api/internal/fieldcrypto/fieldcrypto.go:465-491. Severity: suggestion, confidence: high.'
    - title: 'fieldcrypto adapter: no zero on error path'
      id: 0DI1
      date: "2026-08-13"
      tags:
        - plan/phase:phase-02-versioned-cipher
        - plan/slug:fieldcrypto-key-rotation
        - type:security
        - priority:unspecified
        - effort:unspecified
      text: 'keyStoreAdapter zeroes key material via aliasing on the success path (records[i].KeyBytes shares memory with rows[i].KeyBytes, later zeroed by the cipher), but on a mapping failure (e.g. the negative-version guard) LoadUsableKeys returns nil, discarding both rows and records un-zeroed — asymmetric with the internal package''s reload(), which defers zeroKeyMaterial before calling buildKeySet so a mid-build failure still wipes everything. Best-effort hygiene either way (pgx''s wire buffers hold their own copies), but one corrupt row currently turns the hygiene property off for the whole key set. Fix: wipe rows[i].KeyBytes on the failure path in both LoadUsableKeys and InsertInitialKey before returning an error. Found by phase-2 boundary security review (opus-high), api/fieldcrypto/fieldcrypto.go:65-79. Severity: suggestion, confidence: high.'
    - title: 'fieldcrypto: MustPersist doc wording drift'
      id: pfuW
      date: "2026-08-13"
      tags:
        - plan/phase:phase-02-versioned-cipher
        - plan/slug:fieldcrypto-key-rotation
        - type:documentation
        - priority:unspecified
        - effort:unspecified
      text: api/internal/fieldcrypto/fieldcrypto.go's package doc states MustPersist means "a caller that cannot durably store the replacement blob must fail the read", dropping plan/overview.md's qualifier "...and the compromised ciphertext is not verifiably already gone". The cipher's derivation is correct either way (the escape hatch is caller-side, owned by Phase 3's rotating-cipher-helper), but the wording should be reconciled before Phase 3 implements the caller so it doesn't implement the stricter reading by accident. Found by phase-2 boundary security review (opus-high).
    - title: 'Phase 4: verify Reload authz gate'
      id: MW1a
