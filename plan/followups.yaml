version: 2
items:
    - title: Narrow-measure content width token
      id: XKY2
      date: "2026-08-06"
      tags:
        - type:enhancement
        - plan/phase:contract-documentation
        - priority:unspecified
        - effort:unspecified
      text: '--mf-max-content-width is a single global scalar, so an application whose shell is wide (80rem) but whose reading-oriented pages want a narrow measure (~42rem) cannot express both through the token contract. gui/tokens/CONTRACT.md records this as an accepted open limitation. DECIDED: add a second token role, --mf-max-content-width-narrow, alongside the existing --mf-max-content-width. Implement: define the new custom property in the token source, wire it through gui/style-dictionary/build-tokens.mjs the same way --mf-max-content-width is emitted, and update gui/tokens/CONTRACT.md to document it (replacing the "accepted open limitation" note with the new role''s definition and usage).'
    - title: 'rotating_cipher: lock-timeout 500s'
      id: PNVB
      date: "2026-08-14"
      tags:
        - type:enhancement
        - plan/phase:phase-03-rotate-on-read
        - plan/slug:fieldcrypto-key-rotation
        - priority:unspecified
        - effort:unspecified
      text: 'Under a compromised rotation, any competing row lock on the row being read (e.g. a legitimate concurrent update of the same entity''s own subtype row) converts an ordinary read into a 500: the write-back''s CAS blocks behind the lock, SET LOCAL lock_timeout=''250ms'' fires, and the compromised branch correctly fails the read (verified end-to-end by the integration sub-case at rotating_cipher_integration_test.go:710-743). The failure direction is correct — the CAS never ran, so compromised ciphertext genuinely can''t be shown to be gone — but this operator-visible consequence (sporadic 500s on reads of concurrently-edited rows during a compromise response) was previously unmitigated. DECIDED: retry the write-back transaction once on a lock-timeout (SQLSTATE 55P03) before adjudicating the policy branch — transient contention usually clears within a second attempt. Implement in api/service/rotating_cipher.go:265-272. (The separate documentation angle — recording this consequence in app-mfmanager''s deploy/README.md "Secret generation, loss, and rotation" section — remains tracked as part of that already-deferred rewrite, not duplicated here.) Found by phase-3 boundary security review (opus-high).'
    - title: 'rotate: grace_period_days:0 convergence gap'
      id: LO1V
      date: "2026-08-14"
      tags:
        - plan/phase:phase-04-admin-rotation-api
        - plan/slug:fieldcrypto-key-rotation
        - type:security
        - priority:unspecified
        - effort:unspecified
      text: 'graceDaysParam accepts grace_period_days: 0 on the rotation route, resolving decryptable_until to the retirement instant itself — the key is already past its deadline the moment the transaction commits. Only the process that served the rotation reloads its cipher; every other process keeps the pre-rotation snapshot for up to the 60s key-set TTL and keeps sealing new blobs under the just-retired version, which are then unreadable on write (ListUsableFieldCryptoKeys filters the version out). Worse, since the version isn''t in the loaded set at all, unusableVersionError takes the "unknown key version" branch instead of the one naming PUT /v1/field-crypto-keys/{version}/grace as the recovery action — least-actionable diagnostic for exactly the situation the grace route fixes. Recoverable (clearing the deadline via grace re-admits the version) but only by an operator who works out what happened. Every value >=1 is safe (a one-day window vastly exceeds the 60s convergence bound). DECIDED: reject grace_period_days:0 on the rotation route with a field validation error naming the convergence window (e.g. "grace_period_days must be at least 1 to allow fleet-wide key-set convergence"). Implement in api/httpapi/field_crypto_keys.go:617-629, and update the route''s OpenAPI description accordingly. Found by phase-4 boundary security review (opus-high).'
    - title: 'Doc: compromised-rotation TTL window'
      id: 8x4a
      date: "2026-08-14"
      tags:
        - plan/phase:phase-05-doc-updates
        - plan/slug:fieldcrypto-key-rotation
        - type:documentation
        - priority:unspecified
        - effort:unspecified
      text: 'A rotation with compromised:true is the operator asserting the outgoing key has leaked, but post-commit convergence reloads only the process that served the request. Every other process continues encrypting new plaintext under the key just declared compromised for up to the 60s key-set TTL. PARTIALLY RESOLVED: phase 5''s doc-updates task (001-update-architecture-docs) added this convergence-window caveat to AGENTS.md''s Conventions section, covering the operator-runbook half. Remaining scope: the rotation route''s OpenAPI description (api/openapi.fragment.yaml, POST /field-crypto-keys/rotations) still does not mention that a 201 response is not the point at which the compromised key stops being used fleet-wide — add a note there to fully close this out. Small, well-scoped, doc-only. Originally found by phase-4 boundary security review (opus-high). api/httpapi/field_crypto_keys.go:332-343. Severity: minor, confidence: medium.'
    - title: 'field-crypto-keys: full-scan not point query'
      id: b4lw
      date: "2026-08-14"
      tags:
        - plan/phase:phase-04-admin-rotation-api
        - plan/slug:fieldcrypto-key-rotation
        - type:optimization
        - priority:unspecified
        - effort:unspecified
      text: 'Rotate, MarkCompromised, and SetGrace each need the lifecycle state of exactly one already-known field_crypto_keys row, but all three resolve it via q.ListFieldCryptoKeyMetadata(ctx) — an unbounded, no-WHERE, ORDER-BY-version scan over every key version ever issued — then linear-scan the Go slice (findFieldCryptoKey) for the one row wanted, instead of a WHERE version = $1 point query against the PRIMARY KEY. field_crypto_keys is designed to grow indefinitely (retired keys never pruned), so every future admin call re-pays a cost that grows with the deployment''s entire rotation history for information a single indexed lookup already has. Task 001''s own status doc calls the single-read choice deliberate (avoids a second query, gives 404/409 off one consistent snapshot, supplies the observer''s before-state) — that rationale justifies reading once, not reading the whole table. Separately for Rotate: RetireActiveFieldCryptoKey''s UPDATE already computes retired_at/decryptable_until/compromised_at for the retiring row but its RETURNING clause discards them, returning only version — so the read-back is re-fetching values the write statement itself already computed. Fix: for Rotate, broaden RetireActiveFieldCryptoKey''s RETURNING clause to include the three columns so the handler builds retiredState directly from the UPDATE''s own result; for MarkCompromised/SetGrace, add a single-row query (e.g. GetFieldCryptoKeyByVersion) and have loadRetiredKey call that instead, preserving the same one-snapshot property while bounding the read. Found by phase-4 boundary efficiency review (sonnet-med). api/httpapi/field_crypto_keys.go (multiple sites), model/queries/field_crypto_keys.sql. Severity: minor, confidence: high.'
    - title: Wire data-mf-component onto primitives
      id: A3Op
      date: "2026-08-14"
      tags:
        - type:enhancement
        - plan/phase:contract-documentation
        - priority:unspecified
        - effort:unspecified
      text: 'Followup 7nrP implemented the per-component radius override *compiler mechanism*: mf.component.<component>.radius entries in gui/tokens/component/overrides.json now compile through build-tokens.mjs into a [data-mf-component="<component>"] CSS block that shadows --radius-sm/-md/-lg/-xl for that scope, verified end-to-end with a temporary test entry (button, 9999px). What remains: no actual GUI primitive (e.g. gui/src/button.tsx, card.tsx) sets the data-mf-component="<component>" attribute yet, so the mechanism is unreachable from real components today. DECIDED (implied by 7nrP''s scope note): wire the data-mf-component attribute onto the relevant primitive components (starting with button and card, the followup''s own motivating example — pill buttons vs square-cornered cards) so a brand can actually populate overrides.json and see the effect. See gui/tokens/CONTRACT.md''s "Per-component radius override tier" section (added by 7nrP) for the compiled shape and usage.'
