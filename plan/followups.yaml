version: 1
items:
    - title: Service validation-reason text lost on 400s
      id: womX
      date: "2026-07-15"
      tag: phase-01-apiresp-go
      text: 'Phase-01 correctness review (correctness-001, minor/medium-confidence): adopting apiresp.WriteError drops the specific validation-reason text (e.g. "legal_name is required") that existing service-layer fmt.Errorf("%w: ...", ErrInvalidInput) errors used to surface via err.Error() under the old writeServiceErr. publicMessage always substitutes a generic string for invalid_input, and these errors aren''t built via apiresp.InvalidInput so they carry no structured details[]. Consistent with the design doc''s general allowance for generic 4xx messages, but not explicitly scoped by either task doc. Decide: accept as a documented tradeoff, or follow up to route api/service/{corporation,natural_person,service_account}.go''s validation errors through apiresp.InvalidInput(FieldError{...}) so the reason survives in details[]. See api/apiresp/writer.go, api/httpapi/response.go.'
    - title: gui/ package has no test runner configured
      id: vr20
      date: "2026-07-15"
      tag: phase-02-gui-error-widgets
      text: 'Pre-existing gap (not introduced by this plan): gui/ has no vitest/jest dependency or test script, though the React Developer role doc calls for component tests as a core responsibility. Sibling tasks 002/003 shipped without tests since neither task doc''s Validation section required them. Decide whether/when to add a test runner to gui/.'
    - title: Banner drops detail text when all-unbound
      id: XKQ2
      date: "2026-07-15"
      tag: phase-02-gui-error-widgets
      text: 'Phase-02 correctness review (correctness-002, minor/medium-confidence): in useApiError''s classifyInline (gui/src/lib/use-api-error.ts ~561-567), when details[] is non-empty but none match a rendered field, bannerError falls back to the generic top-level {code,message} rather than surfacing the specific unbound detail messages - even though the adjacent "some bound, some unbound" branch does surface them. Design-doc''s Surface classification table supports the current literal reading, but the asymmetry may be a product surprise. Decide: is generic-message-on-all-unbound intentional, or should it join unbound detail messages like the partial-match branch does?'
    - title: request() has no origin check for token
      id: 7VD3
      date: "2026-07-15"
      tag: phase-02-gui-error-widgets
      text: 'Phase-02 security review (security-001, suggestion/medium-confidence): request() (gui/src/lib/api-client.ts ~106-119) attaches the bearer token to whatever URL the caller passes, with no same-origin/allow-listed-host check. Not exploitable from anything in this diff (no consumer wired yet) - risk depends entirely on how a future consumer calls request(). Consider an optional allowedOrigins/base-URL guard in configureApiClient or request(), or document the implicit same-origin assumption in the doc comment.'
    - title: Default token storage uses localStorage
      id: pBoG
      date: "2026-07-15"
      tag: phase-02-gui-error-widgets
      text: 'Phase-02 security review (security-002, suggestion/low-confidence): default ApiClientAuthHandler (gui/src/lib/api-client.ts ~50-60) stores/reads the bearer token via window.localStorage, readable by any script on the page (XSS-exfiltrable). Intentionally mirrors existing mod-users behavior per code comment, not a new regression; configureApiClient seam already lets consumers substitute a safer strategy. No action needed now - revisit if/when the project moves toward httpOnly-cookie or in-memory-token storage.'
    - title: Masked-miss may 500 not 403 (untraced)
      id: mJ5k
      date: "2026-07-15"
      tag: apiresp-error-widgets
      text: 'Found while spot-checking docs-mf-standards/building-common.md''s error-handling section against this repo''s merged apiresp-error-widgets implementation (not a doc issue — a possible real code gap). entity.Resolver.Resolve (api/entity/resolver.go) returns package-local entity.ErrForbidden/entity.ErrNotFound (distinct Go error values from apiresp.ErrForbidden/apiresp.ErrNotFound, no Unwrap() relating them). apiresp.WriteError''s classify() (api/apiresp/writer.go) only recognizes errors.Is matches against apiresp''s own five sentinels; anything else — including entity.ErrForbidden/entity.ErrNotFound — falls through to the default case: internal_error/500. No code path found in api/service/*.go or api/httpapi/*.go that translates entity.Err* onto apiresp''s sentinels before the error reaches apiresp.WriteError — e.g. EntityService.GetByUUID (api/service/entity.go) returns a resolver miss verbatim. Confirmed only at the service-layer unit-test level (api/service/entity_test.go asserts errors.Is(err, entity.ErrForbidden)); found no httpapi-layer or integration test asserting a masked-missing-UUID request actually yields HTTP 403 forbidden through the full apiresp.WriteError chain. Net effect as merged: a masked entity lookup miss may currently return 500 internal_error rather than the documented 403 forbidden — a possible regression against the design doc''s masking policy, unless there''s a translation step elsewhere that wasn''t found. Needs an engineer to trace/confirm and fix in this repo if real (not a docs fix).'
