    - title: Per-component radius override levers
      id: 7nrP
      date: "2026-08-06"
      tags:
        - type:enhancement
        - plan/phase:contract-documentation
        - priority:unspecified
        - effort:unspecified
      text: gui/tokens/CONTRACT.md documents --mf-radius as the single settable radius lever, with --radius-sm/-md/-lg/-xl derived from it via calc(var(--mf-radius, var(--mf-radius-default)) * k) and explicitly not individually settable. A brand that wants, say, pill-shaped buttons but square-cornered cards cannot express that — every primitive rescales together. The component-override tier (gui/tokens/component/overrides.json, mf.component.<component>.<property>) already exists as the convention for exactly this kind of escape hatch and is intentionally empty; it is the natural home. Note that the per-breakpoint-band lever family added for --mf-content-margins-* is a worked precedent for layering a second override axis onto a derived-calc() token, and could be adapted — the axis there is breakpoint, here it would be component. Not designed, not scoped.
    - title: Adopt spacing tokens in downstream GUIs
      id: AkGw
      date: "2026-08-06"
      tags:
        - type:enhancement
        - plan/phase:contract-documentation
        - priority:unspecified
        - effort:unspecified
      text: 'Adopt spacing/container tokens in downstream GUIs: app-mftodo''s TaskListContainer.tsx, TaskDetailContainer.tsx, and TaskEditorContainer.tsx have already been converted to @moduleforge/core-gui''s container utility (app-mftodo commit 557fee4, "implement phase-01 task-02: adopt container utility in task pages"). Remaining: mod-core/gui/src/ProfileEditor.tsx:51 still hardcodes className="p-6 max-w-xl" and has not been converted. Concrete blocker unchanged: --mf-max-content-width defaults to 80rem while ProfileEditor currently sits at max-w-xl (36rem), so adoption is not a mechanical substitution — it needs a per-app --mf-max-content-width override or a narrower wrapper, and is a visible layout change either way. Needs a decision on how to handle the width mismatch before converting.'
    - title: Narrow-measure content width token
      id: XKY2
      date: "2026-08-06"
      tags:
        - type:enhancement
        - plan/phase:contract-documentation
        - priority:unspecified
        - effort:unspecified
      text: --mf-max-content-width is a single global scalar, so an application whose shell is wide (80rem) but whose reading-oriented pages want a narrow measure (~42rem) cannot express both through the token contract. The obvious extensions are a second role (--mf-max-content-width-narrow) or a container-narrow utility emitted alongside container by gui/style-dictionary/build-tokens.mjs. gui/tokens/CONTRACT.md records this as an accepted open limitation; this item is the tracked follow-up for closing it. Deliberately not designed here — the right shape depends on what downstream adoption actually needs.
