items:
    - title: 'Task worktree''s node_modules was not present '
      id: 0xGl
      date: "2026-07-18"
      tags:
        - type:bug
        - priority:unspecified
        - effort:unspecified
        - plan/phase:gui-test-infrastructure
      text: '[phase-01-gui-test-infrastructure/002-add-initial-component-and-lib-tests.md] Task worktree''s node_modules was not present at task start even though gui/bun.lock already contained the required devDependencies from task 001 (dependencies_installed was reported as ''none'' since only the repo root lacks a lockfile — create-worktree.sh''s dependency-install detection apparently only checks root-level lockfiles, not nested gui/bun.lock). The task agent ran `bun install` inside gui/ to materialize node_modules (no lockfile/manifest changes resulted) rather than halting. Worth a process note for future plan executions in monorepo-style layouts with a nested-only lockfile: prepare-task-worktree''s dependency detection doesn''t descend into subdirectories, so every task worktree touching gui/ will need its own `bun install` step.'
    - title: WriteActionRequired hot-path unconfirmed
      id: b2nA
      date: "2026-07-19"
      tags:
        - type:optimization
        - priority:unspecified
        - effort:unspecified
        - plan/phase:action-required-and-conflict
      text: 'Phase-1 efficiency review (apiresp-action-required plan): isAppRelativePath''s net/url.Parse call allocates more than strictly necessary for a scheme/host-only check. Not a regression (all-new code), and no caller of WriteActionRequired exists anywhere in mod-core yet, so real per-request call frequency is undetermined. Worth a quick look once a consuming module (e.g. mod-users Wave-1) wires in real call sites -- if genuinely hot, consider a lighter string-based check instead of full url.Parse.'
    - title: fieldcrypto lacks key-rotation support
      id: iQt1
      date: "2026-08-03"
      tags:
        - type:enhancement
        - priority:unspecified
        - effort:unspecified
        - cross-repo/origin:mfmanager
      text: 'api/internal/fieldcrypto/fieldcrypto.go''s Cipher holds exactly one 32-byte key; its own package doc states "Key rotation is out of scope for this package; if rotation is required it must be handled at the call site (e.g. re-encrypt on read when the active key differs from the key that produced the stored blob)" -- but no such call site exists anywhere in the ecosystem today, and stored ciphertext carries no key-version tag by which a second key could ever be introduced. Needed to make CORE_FIELD_KEY_HEX rotation possible: (1) a key-version tag written alongside each stored ciphertext blob, and (2) a re-encrypt-on-read path in fieldcrypto''s call sites that re-encrypts under the currently-active key when the stored version differs from it. Until this exists, a leaked CORE_FIELD_KEY_HEX cannot be retired without a from-scratch migration project. Documented as a permanent limitation, not implemented, in app-mfmanager''s deploy/README.md "Secret generation, loss, and rotation" section.'
    - title: Factual correction needed in plan/notes/token
      id: dzEE
      date: "2026-08-06"
      tags:
        - type:ambiguity
        - plan/phase:spacing-token-contract
        - priority:unspecified
        - effort:unspecified
      text: 'Factual correction needed in plan/notes/token-shape-decision.md and this task doc''s validation-8 parenthetical: both claim dist/index.css will not contain a compiled .container rule because mod-core''s own source never uses the class. That''s wrong — baseline dist/index.css already had 6 .container{ rules (built-in, minification-split) and now has 12, because Tailwind''s candidate extractor picks up the bare identifier `container` from `const { container } = render(...)` in gui/src/FieldError.test.tsx and gui/src/ErrorBanner.test.tsx. dist/index.css still carries zero @utility at-rules (verified), so a downstream consumer''s own Tailwind pass genuinely cannot define the utility from the published bundle; the .container rule that IS there today is incidental and could change. Relevant to Phase 2 doc authors and to docs-mf-standards phase 4, which reads notes/token-shape-decision.md as source — the ''it gets purged'' claim should not be repeated.'
